---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
rules:
  # Renovate bumps the mise tools, Go modules and Actions here. The closing
  # sentence gives the risk scorer the compatibility evidence it asked for
  # on #4, where a Go minor with no findings was still rated high.
  - id: renovate
    when: [{ name: renovate, expr: pr.headRef.startsWith("renovate/") }]
    rule: >-
      This is a Renovate update: a mise tool in .mise.toml (Go, goreleaser,
      actionlint, shellcheck), a Go module in go.mod, or a GitHub Action in
      .github/workflows. The question is whether merging breaks the build,
      tests, lint or release. Read the release notes for each version between
      the old and the new; the pull request body often has them, otherwise use
      gh release view on the upstream repository. Go has no GitHub releases:
      its notes are at https://go.dev/doc/go1.N for a minor and
      https://go.dev/doc/devel/release for patches. Save a page with
      curl -sL -o and search it with rg rather than printing it. Match the
      notes against what this repository uses: for Go, the go directive in
      go.mod (a newer toolchain builds the module at that language version)
      and the standard library packages the code imports; for goreleaser, the
      keys in .goreleaser.yaml; for an Action, the inputs the workflows pass.
      Report a removal, rename or changed default that touches one of those.
      A change to something the repository does not use is not a finding. Do
      not read upstream source code or download a compare as a diff. Give an
      open question at most two more commands, then name it in the summary.
      In the summary, say which release notes you read and whether anything
      in them touches this repository.
