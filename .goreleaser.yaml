# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# Every tool under cmd/ ships in one archive per platform. registry.yaml names
# the commands Kritika exposes from it; mise users select them with filter_bins.
# The binaries are static so they run without additional runtime libraries.
project_name: agent-tools

builds:
  - id: konflate
    main: ./cmd/konflate
    binary: konflate
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    # Keep the asset names stable across releases for registry.yaml and mise.
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

# Releases are immutable once published, so release-please creates a draft
# (with its notes and the tag), goreleaser only adds assets to that draft, and
# the release workflow publishes it last.
release:
  mode: keep-existing
  draft: true
  use_existing_draft: true
  preflight:
    fail_on_error: true

changelog:
  disable: true
