# The same tools locally and in CI (jdx/mise-action reads this file).
[tools]
go = "1.27.2"
"aqua:goreleaser/goreleaser" = "2.18.3"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"

[tasks.lint]
description = "Vet the Go code and lint the workflows"
run = ["go vet ./...", "goreleaser check", "actionlint"]

[tasks.test]
description = "Run the Go tests"
run = "go test ./..."

[tasks.build]
description = "Build every tool's release archive into dist/ without publishing"
run = "goreleaser release --snapshot --clean"
